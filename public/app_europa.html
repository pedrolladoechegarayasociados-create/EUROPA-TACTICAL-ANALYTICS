      // Empty default data ready for user input
      const [matches, setMatches] = useState(() => {
        try {

          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch(e) {}
        return OFFICIAL_LEAGUE_MATCHES;
      });

      const [goals, setGoals] = useState(() => {
        try {
          const saved = localStorage.getItem('app_europa_goals_v4');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              const existingIds = new Set(parsed.map(g => g.id));
              const missing = OFFICIAL_LEAGUE_GOALS.filter(g => !existingIds.has(g.id));
              return [...parsed, ...missing];
            }
          }
          return OFFICIAL_LEAGUE_GOALS;
        } catch(e) { return OFFICIAL_LEAGUE_GOALS; }
      });

      const [activeTab, setActiveTab] = useState('standings');

      const [selectedMatchForGoal, setSelectedMatchForGoal] = useState('');

      };

        setEditingGoal(goal);
        setSelectedMatchForGoal(goal.matchId);
        setIsGoalModalOpen(true);
      };

      // Save to localStorage

        localStorage.setItem('app_europa_matches_v4', JSON.stringify(matches));

      useEffect(() => {
        localStorage.setItem('app_europa_goals_v4', JSON.stringify(goals));
      }, [goals]);

      // Native html2canvas PNG export
      const downloadCardAsPng = async () => {
        if (!cardRef.current) return;
        try {
          setIsExporting(true);
          await new Promise((r) => setTimeout(r, 150));
          const canvas = await html2canvas(cardRef.current, {
            scale: 2,
            backgroundColor: '#030712',
            useCORS: true,
          });
          const link = document.createElement('a');
          link.href = canvas.toDataURL('image/png');
          link.download = `Ficha_Tactica_${selectedTeamId !== 'ALL' ? selectedTeamId : 'Liga'}.png`;
          link.click();
          setExportSuccess(true);
          setTimeout(() => setExportSuccess(false), 4000);
        } catch (err) {
          alert('Error al generar la imagen con html2canvas: ' + err.message);
        } finally {
          setIsExporting(false);
        }
      };

      // Standings calculation
      const standings = LEAGUE_TEAMS.map((team) => {
        let played = 0, won = 0, drawn = 0, lost = 0, gf = 0, gc = 0;
        matches.forEach((m) => {
          if (m.homeTeamId === team.id) {
            played++; gf += m.homeScore; gc += m.awayScore;
            if (m.homeScore > m.awayScore) won++;
            else if (m.homeScore === m.awayScore) drawn++;
            else lost++;
          } else if (m.awayTeamId === team.id) {
            played++; gf += m.awayScore; gc += m.homeScore;
            if (m.awayScore > m.homeScore) won++;
            else if (m.awayScore === m.homeScore) drawn++;
            else lost++;
          }
        });
        const pts = won * 3 + drawn;
        const gd = gf - gc;
        return { team, played, won, drawn, lost, gf, gc, gd, pts };
      });
      standings.sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : b.gd - a.gd);

                    >
                      + Nuevo Partido
                    </button>
                  </div>
                </div>

                <div className="space-y-3">
                  {matches.map((m) => {
                    const ht = getTeam(m.homeTeamId);
                    const at = getTeam(m.awayTeamId);
                    const matchGoals = goals.filter(g => g.matchId === m.id);
                    return (
                      <div key={m.id} className="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3 hover:border-slate-700 transition">
                        <div className="flex justify-between items-center flex-wrap gap-2">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-mono text-[10px] text-blue-400 font-bold px-2 py-0.5 rounded bg-blue-950/60 border border-blue-800/40">
                                Jornada {m.jornada}
                              </span>
                              <span className="text-xs text-slate-400">{m.date} • {m.stadium}</span>
                            </div>
                            <div className="text-base font-bold text-white mt-1 flex items-center gap-3">
                              <span style={{ color: ht.color }}>{ht.name}</span>
                              <span className="px-2.5 py-0.5 rounded-lg bg-slate-950 border border-slate-800 font-mono text-sm">
                                <span className="text-blue-400 font-bold">{m.homeScore}</span> - <span className="text-indigo-400 font-bold">{m.awayScore}</span>
                              </span>
                              <span style={{ color: at.color }}>{at.name}</span>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            <button
                              onClick={() => handleOpenCreateGoal(m.id)}
                              className="px-3 py-1.5 text-xs font-bold rounded-xl bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/30 transition cursor-pointer"
                            >
                              + Añadir Gol
                            </button>
                            <button
                              onClick={() => {
                                if (confirm(`¿Eliminar el partido Jornada ${m.jornada} (${ht.shortName} vs ${at.shortName}) y sus goles?`)) {
                                  setMatches(matches.filter(x => x.id !== m.id));
                                  setGoals(goals.filter(x => x.matchId !== m.id));
                                }
                              }}
                              className="text-slate-500 hover:text-rose-400 text-xs p-1.5 rounded-lg hover:bg-rose-950/30 transition cursor-pointer"
                              title="Eliminar partido"
                            >
                              ✕
                            </button>
                          </div>
                        </div>

                        {/* List of goals inside the match */}
                        {matchGoals.length > 0 ? (
                          <div className="pt-2.5 border-t border-slate-800/80 space-y-1.5">
                            <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                              Goles de este encuentro ({matchGoals.length}):
                            </div>
                            <div className="flex flex-wrap gap-2">
                              {matchGoals.map((g) => {
                                const team = getTeam(g.teamId);
                                return (
                                  <div
                                    key={g.id}
                                    className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 hover:border-slate-700 transition"
                                  >
                                    <span className="font-mono text-emerald-400 font-extrabold text-xs">
                                      {g.minute}'
                                    </span>
                                    <span className="text-xs font-bold text-white">
                                      {g.scorer}
                                    </span>
                                    <span className="text-[11px] text-slate-400">
                                      ({team.shortName})
                                    </span>
                                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-semibold border ${
                                      g.tacticalPhase === 'PENDIENTE'
                                        ? 'bg-amber-950/80 text-amber-300 border-amber-600/40'
                                        : 'bg-blue-950/80 text-blue-300 border-blue-800/40'
                                    }`}>
                                      {g.tacticalPhase === 'PENDIENTE' ? '⚠️ Asignar tipo' : `${g.tacticalPhase} • ${g.tacticalSubtype}`}
                                    </span>
                                    <button
                                      type="button"
                                      onClick={() => handleOpenEditGoal(g)}
                                      className="ml-1 px-2 py-0.5 text-[11px] font-bold rounded-lg bg-blue-600/30 hover:bg-blue-600 text-blue-200 hover:text-white border border-blue-500/40 transition cursor-pointer"
                                      title="Modificar minuto o datos de este gol"
                                    >
                                      ✏️ Modificar
                                    </button>
                                    <button
                                      type="button"
                                      onClick={() => {
                                        if (confirm(`¿Eliminar el gol de ${g.scorer} (minuto ${g.minute})?`)) {
                                          setGoals(goals.filter(x => x.id !== g.id));
                                        }
                                      }}
                                      className="text-slate-500 hover:text-rose-400 text-xs px-1 hover:bg-rose-950/40 rounded transition cursor-pointer"
                                      title="Eliminar gol"
                                    >
                                      ✕
                                    </button>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        ) : m.homeScore + m.awayScore > 0 ? (
                          <div className="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-amber-950/30 border border-amber-500/30 text-xs text-amber-200 flex-wrap">
                            <span>⚠️ Resultado {m.homeScore}-{m.awayScore}: Faltan por catalogar los goleadores y tipo.</span>
                            <div className="flex items-center gap-1.5">
                              <button
                                onClick={() => handleOpenCreateGoal(m.id, ht.id)}
                                className="px-2.5 py-1 text-xs font-bold rounded-lg bg-blue-600/30 hover:bg-blue-600 text-blue-200 border border-blue-500/40 transition cursor-pointer"
                              >
                                + Gol {ht.shortName}
                              </button>
                              <button
                                onClick={() => handleOpenCreateGoal(m.id, at.id)}
                                className="px-2.5 py-1 text-xs font-bold rounded-lg bg-indigo-600/30 hover:bg-indigo-600 text-indigo-200 border border-indigo-500/40 transition cursor-pointer"
                              >
                                + Gol {at.shortName}
                              </button>
                            </div>
                          </div>
                        ) : (
                          <div className="text-[11px] text-slate-500 italic pt-1">
                            Sin goles catalogados aún para este encuentro.
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 4: CARD EXPORT */}
            {activeTab === 'card' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center p-4 rounded-2xl bg-slate-900 border border-slate-800">
                  <h2 className="text-sm font-bold text-white">Ficha Táctica para Exportar en PNG</h2>
                  <button
                    onClick={downloadCardAsPng}
                    disabled={isExporting}
                    className="px-4 py-2 text-xs font-bold rounded-xl bg-blue-600 hover:bg-blue-500 text-white cursor-pointer"
                  >
                    {isExporting ? 'Generando...' : 'Descargar Tarjeta (PNG)'}
                  </button>
                </div>

                {exportSuccess && (
                  <div className="p-3 rounded-xl bg-emerald-950 text-emerald-300 text-xs font-bold text-center">
                    ✓ Imagen descargada correctamente con html2canvas.
                  </div>
                )}

                <div className="overflow-x-auto pb-6">
                  <div ref={cardRef} className="w-full min-w-[650px] max-w-2xl mx-auto p-6 rounded-3xl bg-slate-950 border-2 border-slate-800 text-white space-y-4">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                      <div>
                        <div className="text-base font-black uppercase">{targetTeam.name}</div>
                        <div className="text-xs text-blue-400 font-bold">INFORME TÁCTICO OFICIAL</div>
                      </div>
                      <div className="text-xs text-slate-400 font-mono">20 EQUIPOS</div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="p-2 rounded bg-slate-900">Goles Favor: <strong className="text-emerald-400">{targetGoals.length}</strong></div>
                      <div className="p-2 rounded bg-slate-900">Fase ABP: <strong className="text-amber-400">{targetGoals.filter(g => g.tacticalPhase === 'ABP').length}</strong></div>
                      <div className="p-2 rounded bg-slate-900">Posicional: <strong className="text-blue-400">{targetGoals.filter(g => g.tacticalPhase === 'POSICIONAL').length}</strong></div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* GOAL MODAL (CREATE OR EDIT) */}
          {isGoalModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
              <div className="relative w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 my-8 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="font-bold text-base text-white">
                      {editingGoal ? 'Modificar Gol Registrado' : 'Registrar Gol Táctico'}
                    </h3>
                    <p className="text-xs text-slate-400">
                      {editingGoal
                        ? `Modifica el minuto, fase táctica o goleador (Gol ID: ${editingGoal.id})`
                        : 'Introduce los detalles técnicos y el minuto exacto del gol'}
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      setEditingGoal(null);
                      setIsGoalModalOpen(false);
                    }}
                    className="text-slate-400 hover:text-white text-lg p-1"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const match = matches.find(m => m.id === form.matchId.value);
                  const scorerTeamId = form.teamId.value;
                  const concedingTeamId = match ? (scorerTeamId === match.homeTeamId ? match.awayTeamId : match.homeTeamId) : '';
                  const numMinute = Number(form.minute.value) || 1;

                  if (editingGoal) {
                    // Update existing goal
                    const updatedGoal = {
                      ...editingGoal,
                      matchId: form.matchId.value,
                      teamId: scorerTeamId,
                      concedingTeamId,
                      scorer: form.scorer.value.trim() || 'Goleador',
                      minute: numMinute,
                      minuteInterval: form.minuteInterval.value,
                      tacticalPhase: form.tacticalPhase.value,
                      tacticalSubtype: form.tacticalSubtype.value,
                    };

                    setGoals(goals.map(g => g.id === editingGoal.id ? updatedGoal : g));
                  } else {
                    // Create new goal
                    const newGoal = {
                      id: `g-${Date.now()}`,
                      matchId: form.matchId.value,
                      teamId: scorerTeamId,
                      concedingTeamId,
                      scorer: form.scorer.value.trim() || 'Goleador',
                      minute: numMinute,
                      minuteInterval: form.minuteInterval.value,
                      tacticalPhase: form.tacticalPhase.value,
                      tacticalSubtype: form.tacticalSubtype.value,
                    };

                    setGoals([...goals, newGoal]);
                    // Update score if new
                    if (match) {
                      setMatches(matches.map(m => m.id === match.id ? {
                        ...m,
                        homeScore: scorerTeamId === m.homeTeamId ? m.homeScore + 1 : m.homeScore,
                        awayScore: scorerTeamId === m.awayTeamId ? m.awayScore + 1 : m.awayScore,
                      } : m));
                    }
                  }

                  setEditingGoal(null);
                  setIsGoalModalOpen(false);
                }} className="space-y-4 text-xs">
                  
                  {editingGoal && (
                    <div className="p-3 rounded-xl bg-blue-950/40 border border-blue-600/30 text-blue-200 text-xs flex items-center justify-between">
                      <span>✏️ Modo edición activo. Modifica minuto, fase táctica o goleador.</span>
                      <span className="font-mono font-bold text-[11px] text-blue-300">Min: {editingGoal.minute}'</span>
                    </div>
                  )}

                  <div>
                    <label className="block text-slate-400 mb-1">Partido de Liga</label>
                    <select
                      name="matchId"
                      defaultValue={editingGoal ? editingGoal.matchId : (selectedMatchForGoal || (matches[0] && matches[0].id))}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white"
                      onChange={(e) => {
                        const m = matches.find(x => x.id === e.target.value);
                        if (m) {
                          const sel = document.getElementById('goalTeamSel');
                          if (sel) {
                            sel.innerHTML = `<option value="${m.homeTeamId}">${getTeam(m.homeTeamId).name} (Local)</option><option value="${m.awayTeamId}">${getTeam(m.awayTeamId).name} (Visitante)</option>`;
                          }
                        }
                      }}
                    >
                      {matches.map(m => (
                        <option key={m.id} value={m.id}>
                          Jornada {m.jornada}: {getTeam(m.homeTeamId).name} vs {getTeam(m.awayTeamId).name}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">Equipo Autor del Gol</label>
                    <select
                      id="goalTeamSel"
                      name="teamId"
                      defaultValue={editingGoal ? editingGoal.teamId : (matches[0] ? matches[0].homeTeamId : '')}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white"
                    >
                      {(() => {
                        const activeMatch = matches.find(m => m.id === (editingGoal ? editingGoal.matchId : selectedMatchForGoal)) || matches[0];
                        if (!activeMatch) return null;
                        return (
                          <>
                            <option value={activeMatch.homeTeamId}>{getTeam(activeMatch.homeTeamId).name} (Local)</option>
                            <option value={activeMatch.awayTeamId}>{getTeam(activeMatch.awayTeamId).name} (Visitante)</option>
                          </>
                        );
                      })()}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Goleador *</label>
                      <input
                        name="scorer"
                        required
                        defaultValue={editingGoal ? editingGoal.scorer : ''}
                        placeholder="Nombre del goleador"
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Minuto de Juego (1 - 130)</label>
                      <input
                        name="minute"
                        type="number"
                        min="1"
                        max="130"
                        required
                        defaultValue={editingGoal ? editingGoal.minute : 35}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white font-mono font-bold text-sm text-emerald-400"
                        onChange={(e) => {
                          const min = Number(e.target.value);
                          const intSel = document.getElementById('intervalSel');
                          if (intSel && min > 0) {
                            if (min <= 15) intSel.value = 'M1_15';
                            else if (min <= 30) intSel.value = 'M16_30';
                            else if (min <= 45) intSel.value = 'M31_45';
                            else if (min <= 60) intSel.value = 'M46_60';
                            else if (min <= 75) intSel.value = 'M61_75';
                            else intSel.value = 'M76_90';
                          }
                        }}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Tramo de Minutos</label>
                      <select
                        id="intervalSel"
                        name="minuteInterval"
                        defaultValue={editingGoal ? editingGoal.minuteInterval : 'M31_45'}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white"
                      >
                        {MINUTE_INTERVALS.map(i => (
                          <option key={i.key} value={i.key}>{i.label}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Fase Táctica (5 Tipos)</label>
                      <select
                        name="tacticalPhase"
                        defaultValue={editingGoal ? editingGoal.tacticalPhase : 'DIRECTO'}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white"
                        onChange={(e) => {
                          const phase = e.target.value;
                          const sel = document.getElementById('subSel');
                          if (sel && TACTICAL_CATEGORIES[phase]) {
                            sel.innerHTML = '';
                            TACTICAL_CATEGORIES[phase].subtypes.forEach(s => {
                              const opt = document.createElement('option');
                              opt.value = s;
                              opt.text = s;
                              sel.appendChild(opt);
                            });
                          }
                        }}
                      >
                        {Object.keys(TACTICAL_CATEGORIES).map(k => (
                          <option key={k} value={k}>{TACTICAL_CATEGORIES[k].name}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">Subtipo Táctico</label>
                    <select
                      id="subSel"
                      name="tacticalSubtype"
                      defaultValue={editingGoal ? editingGoal.tacticalSubtype : (TACTICAL_CATEGORIES.DIRECTO.subtypes[0])}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white"
                    >
                      {(() => {
                        const activePhase = editingGoal ? editingGoal.tacticalPhase : 'DIRECTO';
                        const cat = TACTICAL_CATEGORIES[activePhase] || TACTICAL_CATEGORIES.DIRECTO;
                        return cat.subtypes.map(s => (
                          <option key={s} value={s}>{s}</option>
                        ));
                      })()}
                    </select>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => {
                        setEditingGoal(null);
                        setIsGoalModalOpen(false);
                      }}
                      className="px-4 py-2 rounded-xl text-slate-400 hover:text-white cursor-pointer"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl font-bold bg-blue-600 hover:bg-blue-500 text-white cursor-pointer shadow-lg transition"
                    >
                      {editingGoal ? 'Guardar Modificaciones' : 'Guardar Gol'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MATCH MODAL */}
          {isMatchModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
              <div className="relative w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 my-8">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base">Registrar Partido de Liga</h3>
                  <button onClick={() => setIsMatchModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  if (form.homeTeamId.value === form.awayTeamId.value) {
                    alert('El equipo local y visitante no pueden ser el mismo');
                    return;
                  }
                  const newMatch = {
                    id: `m-${Date.now()}`,
                    jornada: Number(form.jornada.value),
                    date: form.date.value,
                    homeTeamId: form.homeTeamId.value,
                    awayTeamId: form.awayTeamId.value,
                    homeScore: Number(form.homeScore.value),
                    awayScore: Number(form.awayScore.value),
                    stadium: getTeam(form.homeTeamId.value).stadium,
                    firstGoalTeamId: form.firstGoal.value === 'home' ? form.homeTeamId.value : form.firstGoal.value === 'away' ? form.awayTeamId.value : 'NONE',
                  };
                  setMatches([...matches, newMatch]);
                  setIsMatchModalOpen(false);
                }} className="space-y-4 text-xs">
                  
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Nº Jornada</label>
                      <input name="jornada" type="number" defaultValue={matches.length + 1} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Fecha</label>
                      <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Equipo Local</label>
                      <select name="homeTeamId" defaultValue={LEAGUE_TEAMS[11].id} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white">
                        {LEAGUE_TEAMS.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1">Equipo Visitante</label>
                      <select name="awayTeamId" defaultValue={LEAGUE_TEAMS[2].id} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white">
                        {LEAGUE_TEAMS.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Goles Local</label>
                      <input name="homeScore" type="number" defaultValue="0" min="0" className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-center text-sm font-bold text-blue-400" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Goles Visitante</label>
                      <input name="awayScore" type="number" defaultValue="0" min="0" className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-center text-sm font-bold text-indigo-400" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">Primer Gol</label>
                    <select name="firstGoal" className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white">
                      <option value="home">Equipo Local</option>
                      <option value="away">Equipo Visitante</option>
                      <option value="none">Sin goles (0-0)</option>
                    </select>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setIsMatchModalOpen(false)} className="px-4 py-2 rounded-lg text-slate-400 hover:text-white">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-lg font-bold bg-blue-600 text-white">Guardar Partido</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
            Liga Tactical Hub • 20 Clubes Oficiales • app_europa.html
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
